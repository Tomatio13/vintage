[package]
name = "vintage"
version = "3.0.0"
description = "Visual Interface for Terminal Agents"
authors = ["Taiga Ebihara"]
edition = "2021"
license = "MIT"
repository = "https://github.com/Tomatio13/vintage"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "vintage_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
base64 = "0.22"
tokio = { version = "1", features = ["io-util", "macros", "process", "sync", "time"] }
rfd = "0.15"
mime_guess = "2"
notify = "8.2"
url = "2"
portable-pty = "0.9"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "http2"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSButton", "NSControl", "NSView", "NSWindow"] }
