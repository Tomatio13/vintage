<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title description">
  <title id="title">VINTAGE</title>
  <desc id="description">VINTAGE mountain-ridge app icon</desc>

  <!-- The mountain-ridge mark from vintage-logo.svg, scaled to fill the square -->
  <g transform="translate(46 98.5) scale(4.375)">
    <!-- sunrise disc behind the front ridge -->
    <circle fill="#bfdcf7" cx="84" cy="28" r="16" />

    <!-- back ridge (lightest, farthest) -->
    <path
      fill="#8fb4dc"
      d="M0 69 L20 59 L40 71 L62 61 L82 69 L96 65 L96 84 L0 84 Z"
    />
    <!-- middle ridge -->
    <path
      fill="#4f8fd6"
      d="M0 63 L26 47 L48 63 L70 45 L96 59 L96 84 L0 84 Z"
    />
    <!-- snowcaps on the middle ridge -->
    <path fill="#ffffff" d="M10 57 L26 47 L35 57 Z" />
    <path fill="#ffffff" d="M57 56 L70 45 L80 51 Z" />
    <!-- front ridge (darkest, closest) -->
    <path
      fill="#142033"
      d="M0 57 L24 39 L46 55 L66 29 L96 45 L96 84 L0 84 Z"
    />
    <!-- snowcaps on the front ridge -->
    <path fill="#ffffff" d="M8 51 L24 39 L33 49 L24 44 Z" />
    <path fill="#ffffff" d="M54 45 L66 29 L78 38 L66 36 Z" />
  </g>
</svg>
