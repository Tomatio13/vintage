name: Publish release assets

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create or update
        required: true
        default: v0.5.1

permissions:
  contents: write

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    steps:
      - name: Create the release when it does not yet exist
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            exit 0
          fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "VINTAGE $TAG" --generate-notes
  linux:
    needs: prepare-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with: { toolchain: 1.95.0 }
      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libfontconfig1-dev libfreetype6-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev curl
      - run: tools/package-gpui-deb.sh target/release-assets
      - run: tools/package-gpui-appimage.sh target/release-assets
      - name: Publish Linux packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.tag }}" target/release-assets/VINTAGE_*_amd64.deb target/release-assets/VINTAGE_*_amd64.AppImage --clobber
  windows:
    needs: prepare-release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with: { toolchain: 1.95.0 }
      - run: cargo +1.95.0 build -p vintage-gpui --release --locked
      - run: choco install innosetup -y
      - name: Build Windows setup
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"').Matches[0].Groups[1].Value
          $env:VINTAGE_VERSION = $version
          iscc packaging/windows/vintage.iss
      - name: Publish Windows setup
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.tag }}" VINTAGE_*_x64-setup.exe --clobber
