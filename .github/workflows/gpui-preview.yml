name: Native GPUI

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
    paths: ["crates/**", "Cargo.toml", "Cargo.lock", "packaging/**", "tools/package-gpui-deb.sh", ".github/workflows/gpui-preview.yml"]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libfontconfig1-dev libfreetype6-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev
      - run: cargo +1.95.0 fmt --all --check
      - run: cargo +1.95.0 clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo +1.95.0 test --workspace --locked
      - run: cargo +1.95.0 build -p vintage-gpui --locked
