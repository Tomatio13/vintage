name: Publish Windows executable

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub Release tag to receive the executable
        required: true
        default: v0.5.1

permissions:
  contents: write

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
      - run: cargo +1.95.0 build -p vintage-gpui --release --locked
      - name: Upload executable to the existing release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          files: target/release/vintage-gpui.exe
          fail_on_unmatched_files: true
