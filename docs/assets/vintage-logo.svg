<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 96" role="img" aria-labelledby="title description">
  <title id="title">VINTAGE</title>
  <desc id="description">VINTAGE orbit symbol and wordmark</desc>
  <style>
    .disc { fill: #142033; stroke: #006edc; }
    .orbit { fill: none; stroke: #f4f8ff; }
    .wordmark { fill: #142033; }
    .agent { fill: #006edc; }

    @media (prefers-color-scheme: dark) {
      .disc { fill: #e5f0ff; stroke: #42c8ff; }
      .orbit { stroke: #050914; }
      .wordmark { fill: #e5f0ff; }
      .agent { fill: #42c8ff; }
    }
  </style>

  <g aria-hidden="true">
    <circle class="disc" cx="48" cy="48" r="35" stroke-width="2.5" />
    <ellipse
      class="orbit"
      cx="48"
      cy="48"
      rx="23.75"
      ry="12.5"
      stroke-width="5"
      transform="rotate(32 48 48)"
    />
    <ellipse
      class="orbit"
      cx="48"
      cy="48"
      rx="23.75"
      ry="12.5"
      stroke-width="5"
      transform="rotate(-32 48 48)"
    />
  </g>

  <text
    class="wordmark"
    x="102"
    y="50"
    dominant-baseline="middle"
    font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="46"
    font-weight="720"
    letter-spacing="-1.8"
  >VINT<tspan class="agent">AGE</tspan></text>
</svg>
