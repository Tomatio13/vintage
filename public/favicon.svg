<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <style>
    .disc { fill: #142033; stroke: #006edc; }
    .orbit { fill: none; stroke: #f4f8ff; }

    @media (prefers-color-scheme: dark) {
      .disc { fill: #e5f0ff; stroke: #42c8ff; }
      .orbit { stroke: #050914; }
    }
  </style>
  <circle class="disc" cx="32" cy="32" r="28" stroke-width="2" />
  <ellipse
    class="orbit"
    cx="32"
    cy="32"
    rx="19"
    ry="10"
    stroke-width="4"
    transform="rotate(32 32 32)"
  />
  <ellipse
    class="orbit"
    cx="32"
    cy="32"
    rx="19"
    ry="10"
    stroke-width="4"
    transform="rotate(-32 32 32)"
  />
</svg>
